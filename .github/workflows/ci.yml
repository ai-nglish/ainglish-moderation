name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build twine .
      - name: Unit tests and bytecode check
        run: make PYTHON=python test
      - name: Build and inspect distributions
        if: matrix.python == '3.12'
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          assert "ainglish_moderation/__init__.py" in names, sorted(names)
          print("wheel contains the moderation package")
          PY
