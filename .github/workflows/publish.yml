name: publish

on:
  # The tag is the release decision. A failed run can be retried from its existing workflow run;
  # there is no branch-dispatch path and no second release-published trigger to race the upload.
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match both declared versions
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/v*) ;;
            *)
              echo "::error::Publishing requires a v-tag ref; got '${GITHUB_REF:-<unset>}'."
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          assert match, "pyproject version not found"
          print(match.group(1))
          PY
          )"
          package="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/ainglish_moderation/__init__.py").read_text(encoding="utf-8"))
          versions = [
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          assert len(versions) == 1, "package __version__ assignment not found or ambiguous"
          print(versions[0])
          PY
          )"
          printf 'tag=%s pyproject=%s package=%s\n' "$tag" "$declared" "$package"
          test "$tag" = "$declared"
          test "$tag" = "$package"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Built wheel must import as the tag version
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$(mktemp -d)"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --quiet dist/*.whl
          built="$(cd / && "$venv_dir/bin/python" -c 'import ainglish_moderation; print(ainglish_moderation.__version__)')"
          test "$built" = "${GITHUB_REF_NAME#v}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
