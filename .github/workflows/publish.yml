name: publish

on:
  # The tag is the release decision. A failed run can be retried from its existing workflow run;
  # there is no branch-dispatch path and no second release-published trigger to race the upload.
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match both declared versions
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/v*) ;;
            *)
              echo "::error::Publishing requires a v-tag ref; got '${GITHUB_REF:-<unset>}'."
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          assert match, "pyproject version not found"
          print(match.group(1))
          PY
          )"
          imported="$(PYTHONPATH=src python -c 'import ainglish_moderation; print(ainglish_moderation.__version__)')"
          printf 'tag=%s pyproject=%s package=%s\n' "$tag" "$declared" "$imported"
          test "$tag" = "$declared"
          test "$tag" = "$imported"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Built wheel must import as the tag version
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$(mktemp -d)"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --quiet dist/*.whl
          built="$(cd / && "$venv_dir/bin/python" -c 'import ainglish_moderation; print(ainglish_moderation.__version__)')"
          test "$built" = "${GITHUB_REF_NAME#v}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
